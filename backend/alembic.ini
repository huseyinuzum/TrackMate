# Alembic konfigürasyon dosyası
# Daha fazla bilgi: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Migrasyon dosyalarının yolu
script_location = alembic

# Versiyon dosyasının adlandırma şablonu (tarih + kısa hash)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Zaman dilimi (üretim loglarında tutarlılık için)
timezone = UTC

# Veritabanı URL'si – .env dosyasından okunur (env.py içinde)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
